<main class="container">

    <div class="logo">hajigrinof</div>

    <div class="error-code">404</div>

    <h1 id="title">Love Not Found</h1>

    <p id="message">
        In the search for love, no one but you was found.
    </p>

    <button id="fixButton" onclick="fixError()">
        Fix Error
    </button>

    <div id="fixing">

        <div class="status" id="status">
            Initializing repair...
        </div>

        <div class="progress-box">
            <div class="progress" id="progress"></div>
        </div>

    </div>

    <div id="success">

        <div class="heart">❤️</div>

        <div class="success-title">
            Error Fixed.
        </div>

        <div class="success-text">
            Love has been found.
            <br>
            She is <b>YOU</b>
        </div>

    </div>

    <div class="small">
        Error 404 · Not Found
    </div>

</main>

<script>

    function fixError() {

        const button = document.getElementById("fixButton");
        const fixing = document.getElementById("fixing");
        const progress = document.getElementById("progress");
        const status = document.getElementById("status");
        const success = document.getElementById("success");
        const title = document.getElementById("title");
        const message = document.getElementById("message");

        button.disabled = true;
        button.style.display = "none";

        fixing.style.display = "block";

        let percent = 0;

        const messages = [
            "Initializing repair...",
            "Checking the heart...",
            "Searching for missing love...",
            "Scanning memories...",
            "Almost there...",
            "Finalizing..."
        ];

        let messageIndex = 0;

        const interval = setInterval(() => {

            percent++;

            progress.style.width = percent + "%";

            if (
                percent % 18 === 0 &&
                messageIndex < messages.length - 1
            ) {
                messageIndex++;
                status.textContent = messages[messageIndex];
            }

            if (percent >= 100) {

                clearInterval(interval);

                setTimeout(() => {

                    fixing.style.display = "none";

                    title.style.display = "none";
                    message.style.display = "none";

                    success.style.display = "block";

                }, 600);
            }

        }, 35);
    }

</script>
