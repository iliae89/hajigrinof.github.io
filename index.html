<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سه قاب از خاطرات ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #100e18;
      color: white;
      font-family: Tahoma, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      gap: 12px;
    }

    .heading {
      flex-shrink: 0;
      font-size: clamp(17px, 3vw, 24px);
      font-weight: normal;
      text-align: center;
      color: #f5d9f6;
      text-shadow: 0 0 18px #b96cc4;
    }

    .subtitle {
      flex-shrink: 0;
      font-size: clamp(11px, 2vw, 13px);
      color: #cbb5d0;
      text-align: center;
    }

    .photo-frame {
      position: relative;
      width: 100%;
      height: 0;
      flex: 1;
      min-height: 0;
      max-width: 1200px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      padding: 5px;
      overflow: hidden;
      background: #1b1420;
      box-shadow:
        0 0 35px rgba(180, 100, 200, 0.12),
        0 15px 45px rgba(0, 0, 0, 0.45);
    }

    .photo {
      position: absolute;
      inset: 5px;
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      object-fit: contain;
      object-position: center;
      border-radius: 16px;
      opacity: 0;
      transform: scale(1.025);
      transition:
        opacity 0.65s ease,
        transform 1s ease;
      background: #100e18;
    }

    .photo.active {
      opacity: 1;
      transform: scale(1);
    }

    .bottom {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding-bottom: 3px;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 7px;
      direction: ltr;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 20px;
      background: #6c5872;
      transition: all 0.3s ease;
    }

    .dot.active {
      width: 22px;
      background: #e8b8ed;
      box-shadow: 0 0 10px #ce91d7;
    }

    .number {
      color: #e8d8eb;
      font-size: 12px;
      direction: ltr;
    }

    .heart {
      flex-shrink: 0;
      color: #f0b9df;
      font-size: 19px;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    @media (max-width: 600px) {
      .container {
        padding: 9px;
        gap: 9px;
      }

      .photo-frame {
        border-radius: 17px;
        padding: 4px;
      }

      .photo {
        inset: 4px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        border-radius: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .photo,
      .dot,
      .heart {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    

    <div class="photo-frame">

      <img
        class="photo active"
        src="photo1.jpg"
        alt="عکس اول"
      >

      <img
        class="photo"
        src="photo2.jpg"
        alt="عکس دوم"
      >

      <img
        class="photo"
        src="photo3.jpg"
        alt="عکس سوم"
      >

    </div>

    <div class="bottom">

      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <span class="number" id="number">01 / 03</span>

      <span class="heart">♥</span>

    </div>

  </main>

  <script>
    const photos = document.querySelectorAll(".photo");
    const dots = document.querySelectorAll(".dot");
    const number = document.getElementById("number");

    let current = 0;

    // تعویض عکس‌ها هر ۲٫۵ ثانیه
    setInterval(() => {
      photos[current].classList.remove("active");
      dots[current].classList.remove("active");

      current = (current + 1) % photos.length;

      photos[current].classList.add("active");
      dots[current].classList.add("active");

      number.textContent =
        `0${current + 1} / 03`;

    }, 2500);
  </script>

</body>
</html>
