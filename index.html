
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>یه سؤال مهم...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(220, 20, 60, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(30, 80, 150, 0.15),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #050608,
                    #0b0f16 50%,
                    #050608
                );

            color: #fff;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            padding: 20px;

            overflow: hidden;

            position: relative;
        }

        /* =========================
           BACKGROUND
        ========================= */

        #bgCanvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 0;

            pointer-events: none;
        }

        .noise {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 1;

            opacity: 0.035;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        }

        /* =========================
           MAIN CARD
        ========================= */

        .container {
            position: relative;

            z-index: 5;

            width: min(540px, 100%);

            padding: 50px 32px 45px;

            text-align: center;

            background:
                rgba(13, 17, 24, 0.78);

            border:
                1px solid rgba(255, 255, 255, 0.09);

            border-radius: 32px;

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.65),

                0 0 80px
                rgba(180, 20, 50, 0.08);

            animation:
                cardIn 0.8s ease;
        }

        @keyframes cardIn {

            from {
                opacity: 0;
                transform:
                    translateY(30px)
                    scale(0.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =========================
           TOP LINE
        ========================= */

        .top-line {
            width: 70px;

            height: 3px;

            margin:
                0 auto 35px;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff3158,
                    transparent
                );

            box-shadow:
                0 0 15px
                rgba(255, 49, 88, 0.7);
        }

        /* =========================
           TITLE
        ========================= */

        .small-title {
            font-size: 0.85rem;

            color: #7d8795;

            letter-spacing: 3px;

            margin-bottom: 18px;
        }

        h1 {
            color: #ffffff;

            font-size:
                clamp(
                    2rem,
                    7vw,
                    3.3rem
                );

            font-weight: 800;

            line-height: 1.4;

            margin-bottom: 16px;

            letter-spacing: -1px;

            text-shadow:
                0 0 30px
                rgba(255, 255, 255, 0.08);
        }

        h1 span {
            color: #ff3158;

            display: inline-block;

            animation:
                heartbeat 1.8s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.18);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.18);
            }

            45% {
                transform: scale(1);
            }
        }

        .subtitle {
            color: #7f8998;

            font-size: 0.95rem;

            margin-bottom: 30px;
        }

        /* =========================
           BUTTON AREA
        ========================= */

        .button-box {
            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            min-height: 120px;

            margin-top: 10px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn {
            border: none;

            padding: 18px 38px;

            min-width: 145px;

            min-height: 65px;

            border-radius: 14px;

            font-size: 1.25rem;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            user-select: none;

            touch-action: manipulation;

            position: relative;

            z-index: 10;

            font-family: inherit;
        }

        /* =========================
           YES BUTTON
        ========================= */

        .btn-yes {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff3158,
                    #c8103d
                );

            border:
                1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 8px 0 #780b28,

                0 15px 35px
                rgba(220, 20, 60, 0.3);
        }

        .btn-yes:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 11px 0 #780b28,

                0 20px 50px
                rgba(255, 30, 70, 0.45);
        }

        .btn-yes:active {

            transform:
                translateY(5px)
                scale(0.97);

            box-shadow:
                0 3px 0 #780b28,

                0 8px 20px
                rgba(220, 20, 60, 0.25);
        }

        .btn-yes.glow {

            animation:
                yesGlow 1.2s
                infinite alternate;
        }

        @keyframes yesGlow {

            from {

                box-shadow:
                    0 8px 0 #780b28,

                    0 0 20px
                    rgba(255, 40, 80, 0.3);
            }

            to {

                box-shadow:
                    0 8px 0 #780b28,

                    0 0 50px
                    rgba(255, 40, 80, 0.8),

                    0 0 100px
                    rgba(255, 40, 80, 0.25);
            }
        }

        /* =========================
           NO BUTTON
        ========================= */

        .btn-no {

            color: #b5becb;

            background:
                linear-gradient(
                    135deg,
                    #1a202a,
                    #11161e
                );

            border:
                1px solid
                rgba(255,255,255,0.08);

            box-shadow:
                0 8px 0 #090c11,

                0 10px 30px
                rgba(0,0,0,0.3);
        }

        .btn-no:hover {

            color: #fff;

            border-color:
                rgba(255,255,255,0.18);

            transform:
                translateY(-3px);
        }

        .btn-no:active {

            transform:
                scale(0.93);
        }

        .btn-no.hidden {
            display: none;
        }

        /* =========================
           FINAL MESSAGE
        ========================= */

        .love-message {

            display: none;

            margin-top: 30px;

            padding: 24px 30px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 35, 75, 0.12),
                    rgba(255,255,255,0.03)
                );

            border:
                1px solid
                rgba(255, 50, 85, 0.2);

            color: #fff;

            font-size:
                clamp(
                    1.8rem,
                    6vw,
                    2.8rem
                );

            font-weight: 800;

            box-shadow:
                0 0 40px
                rgba(255, 30, 70, 0.12);

            animation:
                messageIn
                0.7s
                cubic-bezier(.2,1.5,.4,1);
        }

        .love-message.show {
            display: inline-block;
        }

        .rating-box {
            display: none;
            margin-top: 22px;
            padding: 22px;
            border: 1px solid rgba(255, 49, 88, 0.25);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.035);
            animation: messageIn 0.6s ease;
        }

        .rating-box.show { display: block; }

        .rating-question {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 18px;
            color: #f5f5f5;
        }

        .rating-value {
            display: inline-block;
            min-width: 42px;
            margin-bottom: 12px;
            color: #ff5575;
            font-size: 1.8rem;
            font-weight: 800;
        }

        #ratingSlider {
            width: 100%;
            accent-color: #ff3158;
            cursor: pointer;
            margin: 8px 0 18px;
            touch-action: pan-y;
        }

        .rating-scale {
            display: flex;
            justify-content: space-between;
            color: #8993a2;
            font-size: 0.8rem;
            direction: ltr;
        }

        .submit-rating {
            border: 0;
            border-radius: 12px;
            padding: 13px 24px;
            color: white;
            background: linear-gradient(135deg, #ff3158, #c8103d);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
        }

        .rating-feedback {
            min-height: 24px;
            margin-top: 12px;
            color: #ff9aad;
            font-size: 0.95rem;
        }

        @keyframes messageIn {

            0% {
                opacity: 0;

                transform:
                    scale(0.6)
                    translateY(20px);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }

        /* =========================
           PARTICLE CANVAS
        ========================= */

        #particleCanvas {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 999;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {

                padding:
                    40px 20px 35px;

                border-radius: 26px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .button-box {
                gap: 12px;
            }

            .btn {

                min-width: 120px;

                min-height: 58px;

                padding:
                    15px 25px;

                font-size: 1.05rem;
            }
        }

        @media (max-width: 400px) {

            .container {

                padding:
                    35px 15px 30px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .subtitle {
                font-size: 0.82rem;
            }

            .btn {

                min-width: 105px;

                padding:
                    13px 18px;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }

    </style>
</head>

<body>

    <!-- =========================
         BACKGROUND
    ========================= -->

    <canvas id="bgCanvas"></canvas>

    <div class="noise"></div>

    <canvas id="particleCanvas"></canvas>


    <!-- =========================
         MAIN
    ========================= -->

    <div class="container">

        <div class="top-line"></div>

        <div class="small-title">
            یه سؤال جدی...
        </div>

        <h1>
            چهارشنبه بیام ببینمت؟
            <span>🧐</span>
        </h1>

        <div class="subtitle">
            خوب فکر کن... انتخابت مهمه :)
        </div>

        <div
            class="button-box"
            id="buttonBox"
        >

            <button
                class="btn btn-yes"
                id="yesBtn"
            >
                آره 🖤
            </button>

            <button
                class="btn btn-no"
                id="noBtn"
            >
                نه :)
            </button>

        </div>

        <div
            class="love-message"
            id="loveMessage"
        >
            پس می‌بینمت 😁
        </div>

        <div class="rating-box" id="ratingBox">
            <p class="rating-question">به این دوران از ۱۰ چند می‌دی؟ 🖤</p>
            <output class="rating-value" id="ratingValue" for="ratingSlider">5</output>
            <div class="rating-scale"><span>۱</span><span>۱۰</span></div>
            <input id="ratingSlider" type="range" min="1" max="10" step="1" value="5" aria-label="امتیاز از یک تا ده">
            <button class="submit-rating" id="submitRating" type="button">ثبت امتیاز ✨</button>
            <p class="rating-feedback" id="ratingFeedback" aria-live="polite"></p>
        </div>

    </div>


    <script>


        /* =========================================
           BACKGROUND PARTICLES
        ========================================= */

        const bgCanvas =
            document.getElementById(
                "bgCanvas"
            );

        const bgCtx =
            bgCanvas.getContext("2d");

        let particles = [];


        function resizeBg() {

            bgCanvas.width =
                window.innerWidth;

            bgCanvas.height =
                window.innerHeight;
        }


        resizeBg();


        window.addEventListener(
            "resize",
            resizeBg
        );


        class BackgroundParticle {

            constructor() {

                this.reset();

                this.y =
                    Math.random() *
                    bgCanvas.height;
            }


            reset() {

                this.x =
                    Math.random() *
                    bgCanvas.width;

                this.y =
                    -20 -
                    Math.random() *
                    100;

                this.size =
                    Math.random() *
                    2.5 + 0.5;

                this.speed =
                    Math.random() *
                    0.5 + 0.15;

                this.opacity =
                    Math.random() *
                    0.4 + 0.1;

                this.symbol =
                    Math.random() > 0.75
                        ? "✦"
                        : "•";

                this.phase =
                    Math.random() *
                    Math.PI * 2;
            }


            update() {

                this.y +=
                    this.speed;

                this.phase +=
                    0.01;

                this.x +=
                    Math.sin(
                        this.phase
                    ) * 0.15;


                if (
                    this.y >
                    bgCanvas.height + 20
                ) {

                    this.reset();
                }
            }


            draw() {

                bgCtx.save();

                bgCtx.globalAlpha =
                    this.opacity;

                bgCtx.fillStyle =
                    Math.random() > 0.7
                        ? "#ff3158"
                        : "#7f8a9a";

                bgCtx.font =
                    `${this.size * 5}px Arial`;

                bgCtx.textAlign =
                    "center";

                bgCtx.fillText(
                    this.symbol,
                    this.x,
                    this.y
                );

                bgCtx.restore();
            }
        }


        for (
            let i = 0;
            i < 70;
            i++
        ) {

            particles.push(
                new BackgroundParticle()
            );
        }


        function animateBackground() {

            bgCtx.clearRect(
                0,
                0,
                bgCanvas.width,
                bgCanvas.height
            );


            particles.forEach(
                p => {

                    p.update();
                    p.draw();

                }
            );


            requestAnimationFrame(
                animateBackground
            );
        }


        animateBackground();


        /* =========================================
           FOREGROUND EFFECT
        ========================================= */

        const particleCanvas =
            document.getElementById(
                "particleCanvas"
            );

        const particleCtx =
            particleCanvas.getContext(
                "2d"
            );

        let foregroundParticles = [];

        let animationFrame = null;


        function resizeForeground() {

            particleCanvas.width =
                window.innerWidth;

            particleCanvas.height =
                window.innerHeight;
        }


        resizeForeground();


        window.addEventListener(
            "resize",
            resizeForeground
        );


        class CelebrationParticle {

            constructor(x, y) {

                this.x = x;
                this.y = y;


                const angle =
                    Math.random() *
                    Math.PI * 2;

                const speed =
                    Math.random() * 8 + 3;


                this.vx =
                    Math.cos(angle) *
                    speed;

                this.vy =
                    Math.sin(angle) *
                    speed;


                this.size =
                    Math.random() * 10 + 3;

                this.life = 1;

                this.decay =
                    Math.random() *
                    0.015 + 0.008;

                this.gravity =
                    0.04;

                this.rotation =
                    Math.random() *
                    Math.PI;

                this.rotationSpeed =
                    (Math.random() - 0.5) *
                    0.08;


                const colors = [

                    "#ff3158",
                    "#ff5c77",
                    "#ffffff",
                    "#bfc7d4",
                    "#ffb3c0"

                ];


                this.color =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];


                this.type =
                    Math.random() > 0.25
                        ? "heart"
                        : "circle";
            }


            update() {

                this.vx *= 0.99;

                this.vy *= 0.99;

                this.vy +=
                    this.gravity;


                this.x += this.vx;

                this.y += this.vy;


                this.life -=
                    this.decay;


                this.rotation +=
                    this.rotationSpeed;


                this.size *=
                    0.997;


                return (
                    this.life > 0 &&
                    this.size > 0.5
                );
            }


            draw() {

                particleCtx.save();

                particleCtx.globalAlpha =
                    this.life;

                particleCtx.fillStyle =
                    this.color;

                particleCtx.shadowColor =
                    this.color;

                particleCtx.shadowBlur =
                    15;


                particleCtx.translate(
                    this.x,
                    this.y
                );


                particleCtx.rotate(
                    this.rotation
                );


                if (
                    this.type ===
                    "circle"
                ) {

                    particleCtx.beginPath();

                    particleCtx.arc(
                        0,
                        0,
                        this.size,
                        0,
                        Math.PI * 2
                    );

                    particleCtx.fill();

                }

                else {

                    const s =
                        this.size * 0.7;


                    particleCtx.beginPath();

                    particleCtx.moveTo(
                        0,
                        -s
                    );


                    particleCtx.bezierCurveTo(
                        -s * 1.3,
                        -s * 1.4,
                        -s * 1.8,
                        0,
                        0,
                        s * 1.4
                    );


                    particleCtx.bezierCurveTo(
                        s * 1.8,
                        0,
                        s * 1.3,
                        -s * 1.4,
                        0,
                        -s
                    );


                    particleCtx.fill();
                }


                particleCtx.restore();
            }
        }


        function celebration() {

            foregroundParticles = [];


            const centerX =
                window.innerWidth / 2;

            const centerY =
                window.innerHeight / 2;


            for (
                let i = 0;
                i < 300;
                i++
            ) {

                foregroundParticles.push(

                    new CelebrationParticle(

                        centerX +
                        (Math.random() - 0.5) *
                        70,

                        centerY +
                        (Math.random() - 0.5) *
                        70
                    )
                );
            }


            if (animationFrame) {

                cancelAnimationFrame(
                    animationFrame
                );
            }


            function animate() {

                particleCtx.clearRect(
                    0,
                    0,
                    particleCanvas.width,
                    particleCanvas.height
                );


                foregroundParticles =
                    foregroundParticles.filter(
                        particle => {

                            const alive =
                                particle.update();


                            if (alive) {
                                particle.draw();
                            }


                            return alive;
                        }
                    );


                if (
                    foregroundParticles.length
                ) {

                    animationFrame =
                        requestAnimationFrame(
                            animate
                        );

                }

                else {

                    particleCtx.clearRect(
                        0,
                        0,
                        particleCanvas.width,
                        particleCanvas.height
                    );
                }
            }


            animate();


            /* چند موج اضافه */

            let wave = 0;


            const interval =
                setInterval(
                    () => {

                        if (
                            wave >= 4
                        ) {

                            clearInterval(
                                interval
                            );

                            return;
                        }


                        const x =
                            Math.random() *
                            window.innerWidth;

                        const y =
                            Math.random() *
                            window.innerHeight;


                        for (
                            let i = 0;
                            i < 50;
                            i++
                        ) {

                            foregroundParticles.push(

                                new CelebrationParticle(
                                    x,
                                    y
                                )
                            );
                        }


                        wave++;

                    },
                    900
                );
        }
        // آدرس Web app منتشرشده در Google Apps Script
        // اگر یک Web app جدید ساختی، URL جدید را دقیقاً اینجا قرار بده.
        const REPORT_URL = "https://script.google.com/macros/s/AKfycbzo9fEq15jFHW1HB07hZzplnhhsHDyRs4Qxh0AB9AtV1s3f44abF2akUCXF6IJLMFkH0g/exec";

        // در حالت no-cors پاسخ سرور قابل خواندن نیست؛ این تابع فقط ارسال درخواست را پیگیری می‌کند.
        function reportChoice(choice, extra = {}) {
            const payload = {
                choice: String(choice),
                ...extra,
                submittedAt: new Date().toISOString(),
                page: window.location.href
            };

            console.log("ارسال اطلاعات به Google Apps Script:", payload);

            return fetch(REPORT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=UTF-8"
                },
                body: JSON.stringify(payload),
                cache: "no-store",
                redirect: "follow"
            }).then(() => {
                console.log("درخواست ارسال شد؛ ثبت واقعی را در Google Sheets بررسی کن.");
                return true;
            }).catch(error => {
                console.error("ارسال درخواست ناموفق بود:", error);
                return false;
            });
        }

        /* =========================================
           BUTTON LOGIC
        ========================================= */

        const noBtn =
            document.getElementById(
                "noBtn"
            );

        const yesBtn =
            document.getElementById(
                "yesBtn"
            );

        const loveMessage =
            document.getElementById(
                "loveMessage"
            );


        let noMoves = 0;
        const maxNoMoves = 3;
        let answered = false;

        function vibrate(time = 15) {
            if (navigator.vibrate) navigator.vibrate(time);
        }

        function moveNoButton(event) {
            if (answered || noBtn.classList.contains("hidden")) return;

            // بعد از سه بار جابه‌جایی، دکمه در جای خودش می‌ماند.
            if (noMoves >= maxNoMoves) return;

            if (event) event.preventDefault();
            noMoves++;
            vibrate(10);

            const margin = 12;
            const maxX = Math.max(margin, window.innerWidth - noBtn.offsetWidth - margin);
            const maxY = Math.max(margin, window.innerHeight - noBtn.offsetHeight - margin);

            // هر بار دکمه را به یک نقطه‌ی تصادفی داخل صفحه منتقل کن.
            const currentRect = noBtn.getBoundingClientRect();
            let x = margin + Math.random() * Math.max(0, maxX - margin);
            let y = margin + Math.random() * Math.max(0, maxY - margin);

            // اگر جای تصادفی خیلی نزدیک نقطه‌ی فعلی بود، یک بار دیگر انتخاب کن.
            if (Math.abs(x - currentRect.left) < 100 && Math.abs(y - currentRect.top) < 70) {
                x = margin + Math.random() * Math.max(0, maxX - margin);
                y = margin + Math.random() * Math.max(0, maxY - margin);
            }

            noBtn.style.position = "fixed";
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            noBtn.style.zIndex = "1000";
            noBtn.style.transform = "scale(1)";

            if (noMoves >= maxNoMoves) {
                noBtn.title = "حالا می‌تونی انتخابت رو ثبت کنی :)";
            }
        }

        noBtn.addEventListener("click", (event) => {
            if (answered) return;

            if (noMoves < maxNoMoves) {
                moveNoButton(event);
                return;
            }

            answered = true;
            reportChoice("no");
            noBtn.disabled = true;
            yesBtn.style.display = "none";
            noBtn.textContent = "انتخاب شد";
            noBtn.style.position = "static";
            noBtn.style.transform = "none";
            noBtn.style.cursor = "default";
            loveMessage.textContent = "باشه، نظرت محترمه :)";
            loveMessage.classList.add("show");
        });

        noBtn.addEventListener("touchstart", (event) => {
            if (!answered && noMoves < maxNoMoves) {
                moveNoButton(event);
            }
        }, { passive: false });

        noBtn.addEventListener("mouseenter", (event) => {
            if (window.innerWidth > 768 && noMoves < maxNoMoves) {
                moveNoButton(event);
            }
        });

        /* =========================================
           YES BUTTON
        ========================================= */

        yesBtn.addEventListener("click", () => {
            if (answered) return;

            answered = true;
            reportChoice("yes");
            vibrate(30);

            noBtn.classList.add("hidden");
            yesBtn.style.display = "none";
            loveMessage.classList.add("show");
            document.getElementById("ratingBox").classList.add("show");
            celebration();
        });

        const ratingSlider = document.getElementById("ratingSlider");
        const ratingValue = document.getElementById("ratingValue");
        const submitRating = document.getElementById("submitRating");
        const ratingFeedback = document.getElementById("ratingFeedback");

        ratingSlider.addEventListener("input", () => {
            ratingValue.value = ratingSlider.value;
            ratingValue.textContent = ratingSlider.value;
        });
        let ratingSubmitted = false;

        submitRating.addEventListener("click", async () => {
            if (ratingSubmitted) return;

            const score = Number(ratingSlider.value);
            if (!Number.isInteger(score) || score < 1 || score > 10) {
                ratingFeedback.textContent = "لطفاً یک امتیاز بین ۱ تا ۱۰ انتخاب کن.";
                return;
            }

            submitRating.disabled = true;
            submitRating.textContent = "در حال ارسال…";
            ratingFeedback.textContent = "دارم امتیازت رو ارسال می‌کنم…";

            const sent = await reportChoice("rating", { score });

            if (sent) {
                ratingSubmitted = true;
                submitRating.textContent = "درخواست ارسال شد ✓";
                ratingFeedback.textContent = `امتیاز ${score} ارسال شد. برای اطمینان، ردیف جدید را در Google Sheets بررسی کن 🖤`;
            } else {
                submitRating.disabled = false;
                submitRating.textContent = "دوباره تلاش کن ↻";
                ratingFeedback.textContent = "ارسال انجام نشد؛ اتصال اینترنت را بررسی کن و دوباره بزن.";
            }
        });


        /* =========================================
           PREVENT SCROLL / RIGHT CLICK
        ========================================= */

        document.addEventListener(
            "contextmenu",
            event =>
                event.preventDefault()
        );


        console.log(
            "🖤 چهارشنبه Edition"
        );

    </script>

</body>
</html>
