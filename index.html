<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hajigrinof</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #202124;
        }

        .container {
            width: min(90%, 1000px);
        }

        .logo {
            font-size: 50px;
            font-weight: 500;
            margin-bottom: 45px;
            color: #4285f4;
        }

        .error-code {
            font-size: 110px;
            font-weight: 40;
            letter-spacing: -5px;
            margin: 0;
            color: #202124;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 20px 0 12px;
        }

        p {
            font-size: 15px;
            color: #5f6368;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #1a73e8;
            color: white;
            padding: 10px 22px;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }

        a:hover {
            background: #172bc1;
        }

        .small {
            margin-top: 35px;
            font-size: 13px;
            color: #9aa0a6;
        }

        @media (max-width: 500px) {
            .error-code {
                font-size: 72px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">hajigrinof</div>

        <div class="error-code">404</div>

        <h1>Love Not Found</h1>

        <p>
            In the search for love, no one but you was found.
        </p>

        <a href="/">Go back home</a>

        <div class="small">
            Error 404 · Not Found
        </div>

    </main>

</body>
</html>
